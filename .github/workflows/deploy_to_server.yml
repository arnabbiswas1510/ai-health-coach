name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy docker-compose.yml to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          source: "docker-compose.yml"
          target: "/home/pom/docker/garmin-ai-coach"

      - name: Deploy new images to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          timeout: 120s
          debug: true
          script: |
            mkdir -p /home/pom/docker/garmin-ai-coach
            cd /home/pom/docker/garmin-ai-coach

            echo "=== Pulling latest images ==="
            docker compose pull

            echo "=== Shutting down compose stack to remove old and orphaned containers ==="
            docker compose down

            echo "=== Restarting compose stack ==="
            docker compose up -d --remove-orphans

            echo "=== Deployment complete ==="
            docker inspect ai-health-coach --format 'ai-health-coach: {{.State.Status}} (restarts: {{.RestartCount}})'
            exit 0
