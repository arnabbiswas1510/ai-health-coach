name: Deploy to Production Server

on:
  workflow_run:
    workflows: ["Publish Docker Image"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Copy deploy config and Bitwarden resolver to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          source: "docker-compose.yml,.env.template,scripts/render_env.sh,scripts/render_env.py"
          target: "/home/pom/docker/garmin-ai-coach"

      - name: Deploy new images to server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: pom
          key: ${{ secrets.DEPLOY_KEY }}
          port: 2222
          timeout: 120s
          debug: true
          script: |
            mkdir -p /home/pom/docker/garmin-ai-coach
            cd /home/pom/docker/garmin-ai-coach

            chmod +x scripts/render_env.sh

            echo "=== Rendering .env from Bitwarden Secrets Manager ==="
            AUTORENDER_MARKER="$HOME/.config/garmin-ai-coach/autorender.enabled"
            if [ -f "$AUTORENDER_MARKER" ]; then
              if ./scripts/render_env.sh; then
                echo "render_env: .env refreshed from Bitwarden"
              elif [ -f .env ]; then
                echo "::warning::render_env.sh failed; continuing with the existing .env, which may hold stale secrets. Check the bws CLI and the bootstrap token (~/.config/garmin-ai-coach/bws.env or the shared ~/.config/bws/bws.env) on the server."
              else
                echo "::error::render_env.sh failed and no .env exists to fall back on. Aborting before the stack starts with no configuration."
                exit 1
              fi
            elif [ -f .env ]; then
              echo "::notice::auto-render disabled (no $AUTORENDER_MARKER); keeping the hand-maintained .env. Run scripts/render_env.sh manually for the Bitwarden cutover, diff the result, then 'touch $AUTORENDER_MARKER' to enable auto-render."
            else
              echo "::error::no .env on the host and auto-render is not enabled. Run scripts/render_env.sh manually for the cutover before deploying."
              exit 1
            fi

            echo "=== Pulling latest images ==="
            if ! docker compose pull; then
              echo "::error::docker compose pull failed. Aborting rather than restarting on a stale image, which would look like a successful deploy of code that never shipped."
              exit 1
            fi

            echo "=== Shutting down compose stack to remove old and orphaned containers ==="
            docker compose down

            echo "=== Restarting compose stack ==="
            docker compose up -d --remove-orphans

            echo "=== Verifying the container stays up (not crash-looping) ==="
            # `docker compose up -d` returns as soon as the container is created,
            # so a container whose entrypoint aborts immediately still looks like
            # a successful deploy. Poll until it is running, and treat the
            # restarting state as fatal.
            STATE=""
            for i in $(seq 1 12); do
              STATE=$(docker inspect ai-health-coach --format '{{.State.Status}}' 2>/dev/null || echo "missing")
              if [ "$STATE" = "running" ]; then
                sleep 5
                STATE=$(docker inspect ai-health-coach --format '{{.State.Status}}' 2>/dev/null || echo "missing")
                [ "$STATE" = "running" ] && break
              fi
              if [ "$STATE" = "restarting" ] || [ "$STATE" = "exited" ]; then
                echo "::error::container is $STATE — the entrypoint is failing. Last 40 log lines:"
                docker compose logs --tail=40 ai-health-coach || true
                exit 1
              fi
              sleep 5
            done

            if [ "$STATE" != "running" ]; then
              echo "::error::container never reached a stable running state (last state: $STATE). Last 40 log lines:"
              docker compose logs --tail=40 ai-health-coach || true
              exit 1
            fi

            echo "=== Verifying the running container serves the deployed commit ==="
            EXPECTED="${{ github.event.workflow_run.head_sha || github.sha }}"
            SERVED=""
            for i in $(seq 1 12); do
              SERVED=$(curl -fsS -m 5 http://localhost:8001/version 2>/dev/null \
                       | sed -n 's/.*"git_commit"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
              [ -n "$SERVED" ] && break
              sleep 5
            done

            if [ -z "$SERVED" ]; then
              echo "::warning::/version did not respond; could not confirm which build is serving."
            elif [ "$SERVED" = "unknown" ]; then
              echo "::warning::/version reports 'unknown' — image predates the GIT_COMMIT build arg."
            elif [ "$SERVED" != "$EXPECTED" ]; then
              echo "::error::production is serving $SERVED but expected $EXPECTED. The stack is running a stale image."
              exit 1
            else
              echo "OK: production is serving $SERVED"
            fi

            echo "=== Deployment complete ==="
            docker inspect ai-health-coach --format 'ai-health-coach: {{.State.Status}} (restarts: {{.RestartCount}}) image={{.Image}}'
            exit 0
